# scripts/check.conf — İzin Yöneticisi doğrulama sözleşmesi (./scripts/check).
# Format: scripts/check.conf.example · kurallar: docs/testing.md (Resource hygiene, Two speeds).
#
# GREENFIELD (bootstrap 2026-11-07): aşağıdaki adımlar PLANDIR ve yorum satırıdır — henüz kod yok
# (AGENTS.md kural 1: spec yoksa kod yok). Walking skeleton (ilk spec) package.json'u, script'leri ve
# yapılandırmaları oluşturur, satır başındaki "# " işaretini kaldırarak adımları etkinleştirir ve
# residue testini iki profilde de çalıştırır (./scripts/residue, ./scripts/residue --fast). Aynı spec
# .github/workflows/check.yml'e setup-node (24) + `npm ci` adımlarını ekler.
#
# Kaynak envanteri (docs/testing.md, Resource hygiene 1 ve 5) — her adımın geride bırakabileceği:
#   typecheck  tsc: --watch yok, build daemon'ı yok → tek seferlik, geride süreç kalmaz.
#   lint       eslint: tek seferlik; --cache kullanılmaz → .eslintcache dosyası kalmaz.
#   format     prettier --check: tek seferlik, dosya yazmaz.
#   test       vitest: izleme modu (watch) ve worker havuzu → `run` ile tek seferlik, havuz süreç sonunda
#              kapanır; fastify.inject() port açmaz; her test kendi :memory: SQLite'ını açar → bir sonraki
#              çalıştırmaya veri geçmez.
#   build      vite build: tek seferlik, dev server açmaz; çıktı dist/ (gitignore'da), her derlemede baştan yazılır.
# Walking skeleton ayrıca her test adımının hijyen switch'lerinden önce ve sonra AYNI sayıda test
# çalıştırdığını doğrular (bazı koşucular bilinmeyen flag'leri yutup sıfır test çalıştırır).
#
# Önkoşullar — bu makine adımı çalıştırabilir mi? (docs/testing.md, Two speeds 9)
# requires typecheck: node -e "process.exit(Number(process.versions.node.split('.')[0]) === 24 ? 0 : 1)"
# requires lint: node -e "process.exit(Number(process.versions.node.split('.')[0]) === 24 ? 0 : 1)"
# requires format: node -e "process.exit(Number(process.versions.node.split('.')[0]) === 24 ? 0 : 1)"
# requires test: node -e "process.exit(Number(process.versions.node.split('.')[0]) === 24 ? 0 : 1)"
# requires build: node -e "process.exit(Number(process.versions.node.split('.')[0]) === 24 ? 0 : 1)"
# Bağımlılıklar kurulu olmalı (yerelde ve CI'da önce `npm ci`):
# requires typecheck: test -d node_modules
# requires lint: test -d node_modules
# requires format: test -d node_modules
# requires test: test -d node_modules
# requires build: test -d node_modules
#
# Adımlar — [fast] = iç döngü; full = hepsi (tek kanıt). npx --no: eksik paketi indirmez, kurulu olanı kullanır.
# resource hygiene: tek seferlik tip denetimi, --watch yok, daemon yok
# typecheck [fast]: npx --no -- tsc --noEmit
# resource hygiene: tek seferlik lint, --cache yok (cache dosyası bırakmaz); katman kuralları burada (docs/architecture.md)
# lint [fast]: npx --no -- eslint . --max-warnings=0
# resource hygiene: yalnızca kontrol eder, dosya yazmaz
# format [fast]: npx --no -- prettier --check .
# resource hygiene: `run` = izleme modu yok; worker havuzu süreç sonunda kapanır; her test kendi :memory: veritabanı
# test [fast]: npx --no -- vitest run
# resource hygiene: tek seferlik üretim derlemesi, dev server yok (full-only: iç döngüde gerekmez)
# build: npx --no -- vite build
